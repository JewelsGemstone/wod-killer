<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Julie's Workout Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/tabler-icons.min.css" />
<style>
  :root {
    --purple-deep: #1E1852;
    --purple-mid: #2D2480;
    --purple-bright: #5547C8;
    --purple-light: #EEEDFE;
    --purple-muted: #AFA9EC;
    --coral: #E8503A;
    --coral-light: #FAECE7;
    --teal: #1A9E75;
    --teal-light: #E1F5EE;
    --amber: #C97B12;
    --amber-light: #FAEEDA;
    --blue: #2C72C7;
    --blue-light: #E6F1FB;
    --pink: #C44070;
    --pink-light: #FBEAF0;
    --green: #5A8F1A;
    --green-light: #EAF3DE;
    --bg: #F4F3FB;
    --card-bg: #FFFFFF;
    --border: #E2DFFA;
    --text-primary: #16133A;
    --text-secondary: #4E4980;
    --text-muted: #8E89BE;
    --font-display: 'Syne', sans-serif;
    --font-body: 'DM Sans', sans-serif;
    --font-mono: 'DM Mono', monospace;
    --radius: 12px;
    --radius-sm: 8px;
    --sidebar-w: 220px;
    --transition: 0.15s ease;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
  }

  /* ── LAYOUT ─────────────────────────────────── */
  .app { display: flex; min-height: 100vh; }

  /* ── SIDEBAR ─────────────────────────────────── */
  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--purple-deep);
    display: flex;
    flex-direction: column;
    padding: 1.25rem 0.875rem;
    gap: 2px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .sidebar::-webkit-scrollbar { display: none; }

  .logo {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0.25rem 0.625rem 1.1rem;
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.01em;
  }
  .logo i { font-size: 20px; color: var(--purple-muted); }

  .slabel {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 0.7rem 0.625rem 0.25rem;
  }

  .nbtn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13px;
    font-family: var(--font-body);
    color: rgba(255,255,255,0.75);
    border: none;
    background: transparent;
    width: 100%;
    text-align: left;
    transition: background var(--transition), color var(--transition);
  }
  .nbtn:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .nbtn.active { background: var(--purple-bright); color: #fff; font-weight: 500; }
  .nbtn i { font-size: 15px; flex-shrink: 0; color: rgba(255,255,255,0.45); transition: color var(--transition); }
  .nbtn:hover i, .nbtn.active i { color: rgba(255,255,255,0.9); }

  .nbadge {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 11px;
    background: rgba(255,255,255,0.12);
    border-radius: 6px;
    padding: 1px 7px;
    color: rgba(255,255,255,0.6);
    flex-shrink: 0;
  }
  .nbtn.active .nbadge { background: rgba(255,255,255,0.2); color: #fff; }

  .ndivider { height: 0.5px; background: rgba(255,255,255,0.1); margin: 0.6rem 0; }
  .nlink { color: rgba(255,255,255,0.55) !important; }
  .nlink:hover { color: #fff !important; }

  /* ── MAIN ─────────────────────────────────── */
  .main {
    flex: 1;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    min-width: 0;
  }

  .page-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
  }
  .page-title {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 800;
    color: var(--text-primary);
    letter-spacing: -0.02em;
  }
  .page-sub { font-size: 13px; color: var(--text-muted); }

  /* ── SEARCH + FORMAT PILLS ─────────────────── */
  .controls { display: flex; flex-direction: column; gap: 8px; }
  .topbar { display: flex; gap: 8px; }
  .sw { flex: 1; position: relative; }
  .sw i { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 16px; color: var(--text-muted); pointer-events: none; }
  .sw input {
    width: 100%;
    padding: 9px 12px 9px 36px;
    font-size: 13px;
    font-family: var(--font-body);
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--text-primary);
    outline: none;
    transition: border-color var(--transition);
  }
  .sw input:focus { border-color: var(--purple-bright); }
  .sw input::placeholder { color: var(--text-muted); }

  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .fpill {
    font-size: 11.5px;
    font-family: var(--font-mono);
    padding: 4px 11px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--text-secondary);
    cursor: pointer;
    font-weight: 400;
    white-space: nowrap;
    transition: all var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .fpill:hover { border-color: var(--purple-muted); color: var(--purple-mid); }
  .fpill.active-all     { background: var(--purple-deep); color: #fff; border-color: var(--purple-deep); }
  .fpill.active-emom    { background: var(--purple-light); color: var(--purple-mid); border-color: var(--purple-muted); }
  .fpill.active-amrap   { background: var(--coral-light); color: var(--coral); border-color: var(--coral); }
  .fpill.active-chipper { background: var(--teal-light); color: var(--teal); border-color: var(--teal); }
  .fpill.active-ladder  { background: var(--amber-light); color: var(--amber); border-color: var(--amber); }
  .fpill.active-rounds  { background: var(--blue-light); color: var(--blue); border-color: var(--blue); }
  .fpill.active-program { background: var(--pink-light); color: var(--pink); border-color: var(--pink); }
  .fpill.active-sets    { background: var(--green-light); color: var(--green); border-color: var(--green); }
  .fpill.active-superset { background: var(--amber-light); color: var(--amber); border-color: var(--amber); }
  .fpill.active-phased  { background: var(--blue-light); color: var(--blue); border-color: var(--blue); }

  /* ── STATS ─────────────────────────────────── */
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
  .sc {
    border-radius: var(--radius);
    padding: 0.85rem 1rem;
    border: 1.5px solid transparent;
  }
  .sc1 { background: var(--purple-light); border-color: #D5D0FA; }
  .sc2 { background: var(--coral-light); border-color: #F5C9BE; }
  .sc3 { background: var(--teal-light); border-color: #B0E6D3; }
  .sc4 { background: var(--amber-light); border-color: #F0D5A0; }
  .scl { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; margin-bottom: 3px; }
  .sc1 .scl { color: var(--purple-bright); }
  .sc2 .scl { color: var(--coral); }
  .sc3 .scl { color: var(--teal); }
  .sc4 .scl { color: var(--amber); }
  .scv { font-family: var(--font-display); font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
  .sc1 .scv { color: var(--purple-deep); }
  .sc2 .scv { color: #8B2A1A; }
  .sc3 .scv { color: #0A5C42; }
  .sc4 .scv { color: #7A4A08; }
  .scs { font-size: 11px; margin-top: 2px; }
  .sc1 .scs { color: var(--purple-bright); }
  .sc2 .scs { color: var(--coral); }
  .sc3 .scs { color: var(--teal); }
  .sc4 .scs { color: var(--amber); }

  /* ── GRID HEADER ─────────────────────────────── */
  .gh { display: flex; align-items: center; justify-content: space-between; }
  .gt { font-family: var(--font-display); font-size: 14px; font-weight: 700; color: var(--text-secondary); }
  .gc { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }

  /* ── CARDS ─────────────────────────────────── */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }

  .wc {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 1rem;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 7px;
    border: 1.5px solid var(--border);
    border-top: 3px solid transparent;
    transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition);
  }
  .wc:hover {
    border-color: var(--purple-muted);
    border-top-color: inherit;
    box-shadow: 0 4px 16px rgba(85,71,200,0.1);
    transform: translateY(-1px);
  }
  .cat-kb-hybrid   { border-top-color: var(--purple-bright) !important; }
  .cat-kb-wod      { border-top-color: var(--teal) !important; }
  .cat-kb-hard     { border-top-color: #E24B4A !important; }
  .cat-kb-strength { border-top-color: var(--amber) !important; }
  .cat-running     { border-top-color: var(--blue) !important; }
  .cat-lifting     { border-top-color: var(--pink) !important; }
  .cat-legs        { border-top-color: var(--green) !important; }
  .cat-crossfit    { border-top-color: var(--coral) !important; }
  .cat-recovery    { border-top-color: var(--teal) !important; }

  .wctop { display: flex; align-items: flex-start; justify-content: space-between; gap: 5px; }
  .pill {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 500;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .p-kb-hybrid   { background: var(--purple-light); color: var(--purple-mid); }
  .p-kb-wod      { background: var(--teal-light); color: #085041; }
  .p-kb-hard     { background: #FCEBEB; color: #791F1F; }
  .p-kb-strength { background: var(--amber-light); color: #633806; }
  .p-running     { background: var(--blue-light); color: #0C447C; }
  .p-lifting     { background: var(--pink-light); color: #72243E; }
  .p-legs        { background: var(--green-light); color: #27500A; }
  .p-crossfit    { background: var(--coral-light); color: #712B13; }
  .p-recovery    { background: var(--teal-light); color: #085041; }

  .diff {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 6px;
    border: 1.5px solid var(--border);
    color: var(--text-muted);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .diff.adv { background: #FCEBEB; color: #791F1F; border-color: #F09595; }

  .wctitle { font-family: var(--font-display); font-size: 13px; font-weight: 700; color: var(--text-primary); line-height: 1.3; }
  .wcdesc  { font-size: 11.5px; color: var(--text-secondary); line-height: 1.45; }

  .wcmeta { display: flex; flex-wrap: wrap; gap: 8px; }
  .met { display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--text-muted); }
  .met i { font-size: 13px; }

  .wtags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 1px 7px;
    border-radius: 6px;
    background: var(--bg);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  .empty { text-align: center; padding: 4rem; color: var(--text-muted); font-size: 14px; grid-column: 1/-1; }
  .empty i { font-size: 36px; display: block; margin-bottom: 10px; }

  /* ── MODAL ─────────────────────────────────── */
  .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 1000; align-items: center; justify-content: center; }
  .modal.open { display: flex; }
  .modal-content { background: var(--card-bg); border-radius: var(--radius); padding: 2rem; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; position: relative; }
  .modal-close { position: absolute; top: 1.25rem; right: 1.25rem; background: none; border: none; cursor: pointer; font-size: 24px; color: var(--text-muted); transition: color var(--transition); }
  .modal-close:hover { color: var(--text-primary); }
  .modal-title { font-family: var(--font-display); font-size: 20px; font-weight: 800; color: var(--text-primary); margin-bottom: 0.5rem; }
  .modal-meta { display: flex; gap: 8px; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .modal-pill { font-size: 11px; padding: 4px 10px; border-radius: 20px; }
  .modal-section { margin-bottom: 1.5rem; }
  .modal-label { font-family: var(--font-display); font-size: 12px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.5rem; }
  .modal-text { font-size: 14px; line-height: 1.6; color: var(--text-secondary); }
  .modal-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .modal-tag { font-size: 11px; padding: 2px 8px; border-radius: 6px; background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); }
  .modal-equipment { display: flex; flex-wrap: wrap; gap: 6px; }
  .modal-eq { font-size: 12px; padding: 4px 10px; border-radius: 8px; background: var(--bg); color: var(--text-secondary); border: 1px solid var(--border); display: flex; align-items: center; gap: 4px; }
  .modal-eq i { font-size: 14px; }

  /* ── RESPONSIVE ─────────────────────────────── */
  @media (max-width: 768px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: static; flex-direction: row; flex-wrap: wrap; padding: 0.75rem; gap: 4px; }
    .slabel { display: none; }
    .logo { padding-bottom: 0.5rem; width: 100%; }
    .ndivider { display: none; }
    .nbadge { display: none; }
    .nbtn { width: auto; font-size: 12px; padding: 5px 8px; }
    .stats { grid-template-columns: repeat(2,1fr); }
  }
</style>
</head>
<body>
<div class="app">

<!-- SIDEBAR -->
<nav class="sidebar" aria-label="Workout categories">
  <div class="logo"><i class="ti ti-flame" aria-hidden="true"></i> Julie's Workouts</div>

  <span class="slabel">All</span>
  <button class="nbtn active" id="nav-all" onclick="setNav('all')">
    <i class="ti ti-layout-grid" aria-hidden="true"></i> Everything
    <span class="nbadge" id="b-all"></span>
  </button>

  <span class="slabel">Kettlebell</span>
  <button class="nbtn" id="nav-kb-hybrid" onclick="setNav('kb-hybrid')">
    <i class="ti ti-bike" aria-hidden="true"></i> KB + Cardio
    <span class="nbadge" id="b-kb-hybrid"></span>
  </button>
  <button class="nbtn" id="nav-kb-wod" onclick="setNav('kb-wod')">
    <i class="ti ti-calendar-week" aria-hidden="true"></i> 5-Day WODs
    <span class="nbadge" id="b-kb-wod"></span>
  </button>
  <button class="nbtn" id="nav-kb-hard" onclick="setNav('kb-hard')">
    <i class="ti ti-skull" aria-hidden="true"></i> Hard Mode
    <span class="nbadge" id="b-kb-hard"></span>
  </button>
  <button class="nbtn" id="nav-kb-strength" onclick="setNav('kb-strength')">
    <i class="ti ti-barbell" aria-hidden="true"></i> KB Strength
    <span class="nbadge" id="b-kb-strength"></span>
  </button>

  <span class="slabel">Programs</span>
  <button class="nbtn" id="nav-running" onclick="setNav('running')">
    <i class="ti ti-run" aria-hidden="true"></i> 15K Training
    <span class="nbadge" id="b-running"></span>
  </button>
  <button class="nbtn" id="nav-lifting" onclick="setNav('lifting')">
    <i class="ti ti-barbell" aria-hidden="true"></i> Barbell Lifting
    <span class="nbadge" id="b-lifting"></span>
  </button>
  <button class="nbtn" id="nav-legs" onclick="setNav('legs')">
    <i class="ti ti-trending-up" aria-hidden="true"></i> Leg Programs
    <span class="nbadge" id="b-legs"></span>
  </button>
  <button class="nbtn" id="nav-crossfit" onclick="setNav('crossfit')">
    <i class="ti ti-bolt" aria-hidden="true"></i> CrossFit / WODs
    <span class="nbadge" id="b-crossfit"></span>
  </button>
  <button class="nbtn" id="nav-recovery" onclick="setNav('recovery')">
    <i class="ti ti-heart" aria-hidden="true"></i> Recovery
    <span class="nbadge" id="b-recovery"></span>
  </button>

  <div class="ndivider"></div>
  <span class="slabel">Tools</span>
  <button class="nbtn nlink" onclick="pickRandom()">
    <i class="ti ti-dice" aria-hidden="true"></i> Random workout
  </button>
</nav>

<!-- MAIN -->
<main class="main">
  <div class="page-header">
    <h1 class="page-title" id="page-title">Everything</h1>
    <span class="page-sub" id="page-sub"></span>
  </div>

  <div class="controls">
    <div class="topbar">
      <div class="sw">
        <i class="ti ti-search" aria-hidden="true"></i>
        <input type="text" placeholder="Search workouts, movements, equipment…" id="search" oninput="render()" aria-label="Search workouts" />
      </div>
    </div>
    <div class="pills" id="fmt-pills"></div>
  </div>

  <div class="stats" id="stats" aria-label="Statistics"></div>

  <div class="gh">
    <span class="gt" id="section-label"></span>
    <span class="gc" id="result-count"></span>
  </div>

  <div class="grid" id="grid" role="list"></div>
</main>
</div>

<script>
const CATS = {
  'all':'Everything','kb-hybrid':'KB + Cardio','kb-wod':'5-Day WODs',
  'kb-hard':'Hard Mode','kb-strength':'KB Strength + Engine',
  'running':'15K Training Plan','lifting':'Barbell Lifting',
  'legs':'Leg Programs','crossfit':'CrossFit / WODs','recovery':'Recovery'
};
const PILL_LABELS = {
  'kb-hybrid':'KB + Cardio','kb-wod':'5-Day WOD','kb-hard':'Hard Mode',
  'kb-strength':'KB Strength','running':'Running','lifting':'Lifting',
  'legs':'Legs','crossfit':'CrossFit','recovery':'Recovery'
};
const FMT_ICONS = {
  emom:'ti-clock',amrap:'ti-repeat',chipper:'ti-list-numbers',
  ladder:'ti-stairs',rounds:'ti-rotate-clockwise',program:'ti-calendar-stats',
  sets:'ti-table',superset:'ti-arrows-exchange',phased:'ti-timeline'
};

const WS = [
  {id:'se1',cat:'kb-strength',title:'KB Strength + Engine Builder',desc:'Progressive KB squat + swing ladder broken by rowing and Echo Bike intervals.',difficulty:'Advanced',format:'phased',equipment:['Kettlebell','Rower','Echo Bike'],tags:['lower body','posterior chain','aerobic'],source:'kb_strength_and_endurance.md'},
  {id:'w1',cat:'kb-wod',title:'Day 1 — Posterior Chain Power',desc:'Deadlift day: swings, single-leg DL, lunges, good mornings, farmer\'s carry.',difficulty:'Intermediate',format:'sets',equipment:['Kettlebell'],tags:['posterior chain','glutes','hamstrings'],source:'kb_wods.md'},
  {id:'w2',cat:'kb-wod',title:'Day 2 — Upper Body Strength',desc:'Bench day supersets: clean & press, row, floor press, upright row, snatch finisher.',difficulty:'Intermediate',format:'superset',equipment:['Kettlebell'],tags:['upper body','push','pull'],source:'kb_wods.md'},
  {id:'w3',cat:'kb-wod',title:'Day 3 — Mobility & Core',desc:'Active recovery: halos, windmills, Turkish get-ups, side plank rows.',difficulty:'Intermediate',format:'sets',equipment:['Kettlebell'],tags:['mobility','core','recovery'],source:'kb_wods.md'},
  {id:'w4',cat:'kb-wod',title:'Day 4 — Lower Body + Conditioning',desc:'20-min EMOM alternating goblet squats and KB swings + reverse lunge to press.',difficulty:'Intermediate',format:'emom',equipment:['Kettlebell'],tags:['lower body','EMOM','quads'],source:'kb_wods.md'},
  {id:'w5',cat:'kb-wod',title:'Day 5 — Full-Body Athletic Burn',desc:'3 rounds for time: snatch, push press, figure-8, Russian twists, swings, farmer\'s carry sprint.',difficulty:'Intermediate',format:'rounds',equipment:['Kettlebell'],tags:['full body','athletic','power'],source:'kb_wods.md'},
  {id:'h1',cat:'kb-hard',title:'Engine & Iron — Heavy Edition',desc:'6 rounds: Echo Bike cals then unbroken KB complex. 45s rest max.',difficulty:'Advanced',format:'rounds',equipment:['Kettlebell','Echo Bike'],tags:['grip','heavy','unbroken'],source:'kb_hard_core.md'},

let nav = 'all', fmtF = 'all', currentWorkout = null;

function filtered() {
  const q = document.getElementById('search').value.toLowerCase();
  return WS.filter(w => {
    if (nav !== 'all' && w.cat !== nav) return false;
    if (fmtF !== 'all' && w.format !== fmtF) return false;
    if (q) {
      const h = [w.title, w.desc, ...w.tags, ...w.equipment].join(' ').toLowerCase();
      if (!h.includes(q)) return false;
    }
    return true;
  });
}

function setNav(v) {
  nav = v;
  Object.keys(CATS).forEach(k => {
    const e = document.getElementById('nav-' + k);
    if (e) e.className = 'nbtn' + (k === v ? ' active' : '');
  });
  fmtF = 'all';
  renderFmtPills();
  render();
}

function setFmt(v) { fmtF = v; renderFmtPills(); render(); }

function renderFmtPills() {
  const ws = nav === 'all' ? WS : WS.filter(w => w.cat === nav);
  const present = [...new Set(ws.map(w => w.format))].sort();
  const c = document.getElementById('fmt-pills');
  c.innerHTML = `<button class="fpill${fmtF === 'all' ? ' active-all' : ''}" onclick="setFmt('all')">All formats</button>` +
    present.map(f => `<button class="fpill${fmtF === f ? ' active-' + f : ''}" onclick="setFmt('${f}')"><i class="ti ${FMT_ICONS[f] || 'ti-layout'}" style="font-size:11px" aria-hidden="true"></i> ${f}</button>`).join('');
}

function eqIcon(e) {
  if (e.includes('Bike')) return 'ti-bike';
  if (e.includes('Row') || e.includes('Rower')) return 'ti-rowing';
  if (e.includes('Run')) return 'ti-run';
  if (e.includes('Barbell') || e.includes('Rack')) return 'ti-barbell';
  return 'ti-weight';
}

function pickRandom() {
  const pool = filtered().length > 0 ? filtered() : WS;
  const w = pool[Math.floor(Math.random() * pool.length)];
  document.getElementById('search').value = w.title;
  render();
  setTimeout(() => {
    document.getElementById('search').value = '';
    alert('🎲 Today\'s workout: ' + w.title + '\n\n' + w.desc + '\n\nSource file: ' + w.source);
    render();
  }, 300);
}

function render() {
  const ws = filtered();
  Object.keys(CATS).forEach(k => {
    const e = document.getElementById('b-' + k);
    if (e) e.textContent = k === 'all' ? WS.length : WS.filter(w => w.cat === k).length;
  });

  const adv = ws.filter(w => w.difficulty === 'Advanced').length;
  const progs = ws.filter(w => w.format === 'program').length;
  const emoms = ws.filter(w => w.format === 'emom').length;
  const cats = new Set(ws.map(w => w.cat)).size;

  document.getElementById('stats').innerHTML = `
    <div class="sc sc1"><div class="scl">Workouts</div><div class="scv">${ws.length}</div><div class="scs">in view</div></div>
    <div class="sc sc2"><div class="scl">Advanced</div><div class="scv">${adv}</div><div class="scs">${ws.length ? Math.round(adv / ws.length * 100) : 0}% of total</div></div>
    <div class="sc sc3"><div class="scl">Programs</div><div class="scv">${progs}</div><div class="scs">multi-week plans</div></div>
    <div class="sc sc4"><div class="scl">EMOMs</div><div class="scv">${emoms}</div><div class="scs">across ${cats} categor${cats === 1 ? 'y' : 'ies'}</div></div>`;

  const label = CATS[nav] || 'Everything';
  document.getElementById('page-title').textContent = label;
  document.getElementById('section-label').textContent = label;
  document.getElementById('result-count').textContent = ws.length + ' workout' + (ws.length !== 1 ? 's' : '');
  document.getElementById('page-sub').textContent = ws.length + ' workout' + (ws.length !== 1 ? 's' : '');

  document.getElementById('grid').innerHTML = ws.length ? ws.map(w => `
    <article class="wc cat-${w.cat}" role="listitem" tabindex="0" onclick="openWorkout('${w.id}')" onkeydown="if(event.key==='Enter')openWorkout('${w.id}')">
      <div class="wctop">
        <span class="pill p-${w.cat}">${PILL_LABELS[w.cat] || w.cat}</span>
        <span class="diff${w.difficulty === 'Advanced' ? ' adv' : ''}">${w.difficulty}</span>
      </div>
      <div class="wctitle">${w.title}</div>
      <div class="wcdesc">${w.desc}</div>
      <div class="wcmeta">${[...new Set(w.equipment)].slice(0, 2).map(e => `<span class="met"><i class="ti ${eqIcon(e)}" aria-hidden="true"></i>${e}</span>`).join('')}</div>
      <div class="wtags">${w.tags.slice(0, 3).map(t => `<span class="tag">${t}</span>`).join('')}</div>
    </article>`).join('') :
    `<div class="empty"><i class="ti ti-mood-empty"></i>No workouts match — try a different filter</div>`;
}

function openWorkout(id) {
  const w = WS.find(x => x.id === id);
  if (!w) return;
  
  currentWorkout = w; // Track for "View Full Workout" button
  
  // Title
  document.getElementById('modal-title').textContent = w.title;
  
  // Pills: category, difficulty, format
  document.getElementById('modal-meta').innerHTML = `
    <span class="modal-pill pill p-${w.cat}">${PILL_LABELS[w.cat]}</span>
    <span class="modal-pill diff${w.difficulty === 'Advanced' ? ' adv' : ''}">${w.difficulty}</span>
    <span class="modal-pill" style="background: var(--bg); color: var(--text-secondary); border: 1px solid var(--border);">${w.format}</span>
  `;
  
  // Description
  document.getElementById('modal-desc').textContent = w.desc;
  
  // Equipment
  document.getElementById('modal-equipment').innerHTML = w.equipment.map(e => `
    <div class="modal-eq">
      <i class="ti ${eqIcon(e)}" aria-hidden="true"></i>${e}
    </div>
  `).join('');
  
  // Tags
  document.getElementById('modal-tags').innerHTML = w.tags.map(t => `<span class="modal-tag">${t}</span>`).join('');
  
  // Source
  document.getElementById('modal-source').textContent = w.source;
  
  // Show modal
  document.getElementById('modal').classList.add('open');
}

function openFullWorkout() {
  if (!currentWorkout) return;
  // Option 1: Open raw markdown on GitHub
  const repoUrl = 'https://github.com/JewelsGemstone/wod-killer/blob/main/' + currentWorkout.source;
  alert('📄 Full workout details are in: ' + currentWorkout.source + '\n\nOnce you push to GitHub, you can view the markdown file here:\n' + repoUrl + '\n\n(Update YOUR-USERNAME and YOUR-REPO in the HTML)');
  // Uncomment the line below once you set your repo details:
  // window.open(repoUrl, '_blank');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

// Close modal on Escape key
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

renderFmtPills();
render();
</script>

<!-- MODAL POPUP -->
<div class="modal" id="modal" onclick="if(event.target.id==='modal') closeModal()">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <h2 class="modal-title" id="modal-title"></h2>
    <div class="modal-meta" id="modal-meta"></div>
    
    <div class="modal-section">
      <div class="modal-label">Description</div>
      <div class="modal-text" id="modal-desc"></div>
    </div>
    
    <div class="modal-section">
      <div class="modal-label">Equipment</div>
      <div class="modal-equipment" id="modal-equipment"></div>
    </div>
    
    <div class="modal-section">
      <div class="modal-label">Tags</div>
      <div class="modal-tags" id="modal-tags"></div>
    </div>
    
    <div class="modal-section">
      <div class="modal-label">Source File</div>
      <div class="modal-text" id="modal-source"></div>
    </div>
    
    <div class="modal-section" style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1.5px solid var(--border);">
      <button onclick="openFullWorkout()" style="width: 100%; padding: 10px 16px; background: var(--purple-bright); color: white; border: none; border-radius: var(--radius-sm); font-weight: 500; cursor: pointer; font-family: var(--font-body); font-size: 14px; transition: background var(--transition);" onmouseover="this.style.background='var(--purple-mid)'" onmouseout="this.style.background='var(--purple-bright)'">
        📄 View Full Workout Details
      </button>
    </div>
  </div>
</div>
